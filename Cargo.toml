[workspace]
members = ["crates/terminal-core", "crates/terminal-protocol", "crates/terminal-host"]
resolver = "3"

[package]
name = "muster"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []
gui = ["dep:wry", "dep:tao", "dep:webkit2gtk"]

[dependencies]
muster-terminal-protocol = { path = "crates/terminal-protocol" }
muster-terminal-core = { path = "crates/terminal-core" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures = "0.3"
libc = "0.2"
notify-rust = "4"
parking_lot = "0.12"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = "8"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wry = { version = "0.53", optional = true }
tao = { version = "0.34", optional = true }
jiff = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# The same version wry uses; only for the web-process-crash signal (src/gui.rs).
webkit2gtk = { version = "=2.0.1", optional = true }

[profile.release]
lto = "thin"
