[package]
name = "muster-terminal-host"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
bytes = "1"
libc = "0.2"
muster-terminal-core = { path = "../terminal-core" }
muster-terminal-protocol = { path = "../terminal-protocol" }
parking_lot = "0.12"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
