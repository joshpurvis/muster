<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Muster</title>
    <link rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238b7cf6'/%3E%3Ctext x='16' y='22.5' font-family='system-ui,sans-serif' font-size='18' font-weight='800' text-anchor='middle' fill='white'%3Em%3C/text%3E%3C/svg%3E" />
    <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      const p = JSON.parse(localStorage.getItem("muster.prefs") || "{}");
      const t = p.theme || "system";
      document.documentElement.dataset.theme = t === "system"
        ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
        : t;
    } catch (_) { /* storage unavailable */ }
    </script>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
