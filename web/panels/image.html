<title>Muster image</title>
<style>
/* Muster Kit: the "Briefing" look for every panel.
   Built-ins and agent-written panels share it. web/dev/build_panels.ts puts it into every built-in
   app, and Muster injects it (with kit.js) in front of a custom panel opened with kit: true, so an
   agent's own HTML spends none of its 1 MiB on it.
   Type scale (px): 11 · 12 · 13 · 14 · 15 · 17 · 20 · 26. Nothing below 11.
   Contrast: text tokens ≥ 4.5:1 on every surface they sit on, in both themes; marks ≥ 3:1.
   Scope: everything lives under .mk (kit.js puts it on <html>); data-theme comes from the host. */

/* The two fonts (Inter and JetBrains Mono, OFL; web/panels/fonts/) are @font-face rules with
   data: URIs that Muster puts in place of this marker when it serves the panel (src/panel_kit.rs). */
/*MK-FONTS*/

:root, [data-theme] {
  --mk-font: "MK Inter", Inter, system-ui, sans-serif;
  --mk-mono: "MK Mono", "JetBrains Mono", ui-monospace, monospace;
  --mk-r-sm: 6px;
  --mk-r: 10px;
  --mk-r-lg: 14px;
  --mk-ease: cubic-bezier(.16, 1, .3, 1);
}

/* ---------- dark (default) ---------- */
:root, [data-theme="dark"] {
  color-scheme: dark;
  --mk-canvas: #121215;
  --mk-surface: #18181c;
  --mk-raised: #1e1e23;
  --mk-sunken: #0e0e10;
  --mk-line: rgba(255, 255, 255, .065);
  --mk-line-2: rgba(255, 255, 255, .11);
  --mk-line-3: rgba(255, 255, 255, .2);
  --mk-hi: rgba(255, 255, 255, .035);
  --mk-text: #ececf1;
  --mk-text-2: #b4b4c0;
  --mk-text-3: #93939f;                      /* ≥ 5.4:1 on every dark surface */
  --mk-accent: #a194ff;
  --mk-accent-fill: #6652e0;
  --mk-accent-soft: rgba(161, 148, 255, .13);
  --mk-on-accent: #fff;
  --mk-good: #4fc98c;  --mk-good-soft: rgba(79, 201, 140, .12);
  --mk-warn: #f2b450;  --mk-warn-soft: rgba(242, 180, 80, .12);
  --mk-bad: #ff7b78;   --mk-bad-soft: rgba(255, 123, 120, .12);
  --mk-bad-fill: #c42b31;                    /* a primary danger button: white text ≥ 4.5:1 */
  --mk-info: #74b4ff;  --mk-info-soft: rgba(116, 180, 255, .12);
  --mk-add: #4fc98c; --mk-del: #ff7b78;
  --mk-add-bg: rgba(79, 201, 140, .09); --mk-del-bg: rgba(255, 123, 120, .09);
  /* Categorical series: violet leads (Muster's own colour), teal second; no series hue is the good-green or bad-red. */
  --mk-c1: #a194ff; --mk-c2: #41c7c1; --mk-c3: #f2b450; --mk-c4: #5fb4ff;
  --mk-c5: #e98bd6; --mk-c6: #cfab84; --mk-c7: #8f9bff; --mk-c8: #f0866b;
  --mk-context: #6b6b78;                     /* de-emphasised series: 3.6:1 on canvas */
  --mk-shadow: 0 1px 0 var(--mk-hi) inset, 0 10px 28px -14px rgba(0, 0, 0, .7);
  --mk-pop: 0 18px 44px -12px rgba(0, 0, 0, .75), 0 0 0 1px rgba(255, 255, 255, .08);
  --mk-select: rgba(161, 148, 255, .32);
}

/* ---------- light ---------- */
[data-theme="light"] {
  color-scheme: light;
  --mk-canvas: #f7f7f9;
  --mk-surface: #ffffff;
  --mk-raised: #ffffff;
  --mk-sunken: #f0f0f4;
  --mk-line: rgba(20, 20, 40, .075);
  --mk-line-2: rgba(20, 20, 40, .12);
  --mk-line-3: rgba(20, 20, 40, .22);
  --mk-hi: rgba(255, 255, 255, 1);
  --mk-text: #17171c;
  --mk-text-2: #4c4c57;
  --mk-text-3: #64646f;                      /* ≥ 5.1:1 on every light surface */
  --mk-accent: #5a48d8;
  --mk-accent-fill: #5a48d8;
  --mk-accent-soft: rgba(90, 72, 216, .09);
  --mk-good: #146b44;  --mk-good-soft: rgba(20, 107, 68, .08);   /* ≥ 5.6:1 on its soft fill */
  --mk-warn: #8a4f00;  --mk-warn-soft: rgba(214, 138, 0, .11);   /* ≥ 5.4:1 */
  --mk-bad: #b81f28;   --mk-bad-soft: rgba(201, 37, 45, .07);    /* ≥ 5.6:1 */
  --mk-bad-fill: #b81f28;
  --mk-info: #1a5fb8;  --mk-info-soft: rgba(31, 111, 209, .08);  /* ≥ 5.5:1 */
  --mk-add: #1a7f37; --mk-del: #cf222e;
  --mk-add-bg: rgba(26, 127, 55, .08); --mk-del-bg: rgba(207, 34, 46, .07);
  --mk-c1: #6a56e6; --mk-c2: #0e8a85; --mk-c3: #b97500; --mk-c4: #2b7bd9;
  --mk-c5: #bb3f9c; --mk-c6: #8f6b45; --mk-c7: #4d5bd6; --mk-c8: #c8553a;
  --mk-context: #a3a3b0;                     /* 2.5:1: recessive on purpose; series that matter get a colour */
  --mk-shadow: 0 1px 2px rgba(20, 20, 40, .05), 0 8px 24px -14px rgba(20, 20, 40, .18);
  --mk-pop: 0 18px 44px -12px rgba(20, 20, 40, .26), 0 0 0 1px rgba(20, 20, 40, .08);
  --mk-select: rgba(90, 72, 216, .2);
}

/* ---------- base ---------- */
.mk {
  background: var(--mk-canvas);
  color: var(--mk-text);
  font: 14px/1.55 var(--mk-font);
  font-feature-settings: "cv11", "ss03", "calt";
  -webkit-font-smoothing: antialiased;
  caret-color: var(--mk-accent);
  scrollbar-color: var(--mk-line-3) transparent;
  scrollbar-width: thin;
}
.mk ::selection { background: var(--mk-select); color: inherit; }
.mk ::-webkit-scrollbar { width: 10px; height: 10px; }
.mk ::-webkit-scrollbar-thumb { background: var(--mk-line-3); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
.mk ::-webkit-scrollbar-thumb:hover { background-color: var(--mk-text-3); }
.mk ::-webkit-scrollbar-track, .mk ::-webkit-scrollbar-corner { background: transparent; }
.mk *, .mk *::before, .mk *::after { box-sizing: border-box; }
.mk :focus-visible { outline: 2px solid var(--mk-accent); outline-offset: 2px; border-radius: 4px; }
.mk .num, .mk .mk-num { font-variant-numeric: tabular-nums; }
.mk code, .mk kbd, .mk .mono { font-family: var(--mk-mono); font-size: .86em; letter-spacing: 0; }
.mk a { color: var(--mk-accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.mk kbd {
  display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 5px; text-align: center;
  font-size: 11px; line-height: 17px; color: var(--mk-text-3);
  background: var(--mk-sunken); box-shadow: inset 0 -1px 0 var(--mk-line-2), inset 0 0 0 1px var(--mk-line);
}

/* ---------- page and header: the finding first ---------- */
.mk-page { padding: 22px 26px 28px; max-width: 1180px; margin: 0 auto; container-type: inline-size; }
.mk-head { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; margin-bottom: 20px; }
.mk-head > div:first-child { min-width: 0; flex: 1 1 300px; }
.mk-title { margin: 0; font-size: 20px; line-height: 1.25; font-weight: 640; letter-spacing: -0.018em; color: var(--mk-text); text-wrap: pretty; }
/* What the panel is about (repo, period). Trails the title; never sits above it. */
.mk-scope { display: inline-block; font-size: 14px; font-weight: 450; letter-spacing: -0.005em; color: var(--mk-text-3); margin-left: 4px; }
.mk-takeaway { margin: 6px 0 0; font-size: 15px; line-height: 1.5; color: var(--mk-text-2); max-width: 68ch; text-wrap: pretty; }
.mk-takeaway b, .mk-takeaway strong { color: var(--mk-text); font-weight: 600; }
.mk-section { margin-top: 24px; }
.mk-section > h2, .mk-h2 {
  display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px;
  font-size: 13px; font-weight: 620; letter-spacing: -0.003em; color: var(--mk-text-2);
}
.mk-section > h2 .count, .mk-h2 .count { color: var(--mk-text-3); font-weight: 450; }
.mk-foot {
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between;
  margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--mk-line);
  font-size: 12px; color: var(--mk-text-3);
}
.mk-note { margin: 10px 0 0; font-size: 12px; color: var(--mk-text-3); }

/* ---------- layout ---------- */
.mk-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--min, 220px)), 1fr)); }
.mk-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.mk-stack { display: grid; gap: 14px; }
/* A cell that takes the whole row, at any width (no phantom columns when the grid drops to one). */
.mk-wide, .mk-span-2 { grid-column: 1 / -1; }
.mk-cell { min-width: 0; display: grid; }
.mk-cell.mk-actions { align-items: center; }

/* ---------- card ---------- */
.mk-card {
  position: relative; min-width: 0; container-type: inline-size;
  background: var(--mk-surface); border: 1px solid var(--mk-line); border-radius: var(--mk-r);
  box-shadow: var(--mk-shadow); padding: 14px 16px;
}
.mk-card > h2, .mk-card > h3, .mk-card-title {
  display: flex; align-items: baseline; gap: 8px; margin: 0 0 12px;
  font-size: 13px; font-weight: 620; color: var(--mk-text); letter-spacing: -0.003em;
}
.mk-card .aside { margin-left: auto; font-weight: 450; font-size: 12px; color: var(--mk-text-3); }
/* Tone: the card's own border and a faint wash, never a side stripe. */
.mk-card.tone-good { border-color: color-mix(in srgb, var(--mk-good) 40%, transparent); background: color-mix(in srgb, var(--mk-good) 4%, var(--mk-surface)); }
.mk-card.tone-warn { border-color: color-mix(in srgb, var(--mk-warn) 40%, transparent); background: color-mix(in srgb, var(--mk-warn) 4%, var(--mk-surface)); }
.mk-card.tone-bad  { border-color: color-mix(in srgb, var(--mk-bad) 40%, transparent);  background: color-mix(in srgb, var(--mk-bad) 4%, var(--mk-surface)); }
.mk-card.flat { box-shadow: none; background: transparent; }

/* ---------- stat ---------- */
.mk-stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mk-stat .label { font-size: 12px; color: var(--mk-text-2); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.mk-stat .label i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }
.mk-stat .value {
  font-size: 26px; line-height: 1.15; font-weight: 620; letter-spacing: -0.025em; color: var(--mk-text);
  font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
}
.mk-stat .value small { font-size: 13px; font-weight: 500; color: var(--mk-text-3); margin-left: 3px; letter-spacing: 0; }
.mk-stat .meta { display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; font-size: 12px; color: var(--mk-text-3); }
.mk-stat svg.spark { margin-top: auto; padding-top: 6px; max-width: 100%; }
.mk-delta { display: inline-flex; align-items: center; padding: 1px 6px; border-radius: 999px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mk-delta.up { color: var(--mk-good); background: var(--mk-good-soft); }
.mk-delta.down { color: var(--mk-bad); background: var(--mk-bad-soft); }
.mk-delta.flat { color: var(--mk-text-2); background: var(--mk-sunken); }
.mk-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); border: 1px solid var(--mk-line); border-radius: var(--mk-r); background: var(--mk-surface); box-shadow: var(--mk-shadow); overflow: hidden; }
.mk-stats > .mk-stat { padding: 13px 16px 14px; border-right: 1px solid var(--mk-line); border-bottom: 1px solid var(--mk-line); margin: 0 -1px -1px 0; }

/* ---------- badge / chip ---------- */
.mk-badge {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px;
  font-size: 12px; font-weight: 600; white-space: nowrap;
  color: var(--mk-text-2); background: var(--mk-sunken); box-shadow: inset 0 0 0 1px var(--mk-line);
}
.mk-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.mk-badge.plain::before { display: none; }
.mk-badge.good { color: var(--mk-good); background: var(--mk-good-soft); box-shadow: none; }
.mk-badge.warn { color: var(--mk-warn); background: var(--mk-warn-soft); box-shadow: none; }
.mk-badge.bad  { color: var(--mk-bad);  background: var(--mk-bad-soft);  box-shadow: none; }
.mk-badge.info { color: var(--mk-info); background: var(--mk-info-soft); box-shadow: none; }
.mk-badge.accent { color: var(--mk-accent); background: var(--mk-accent-soft); box-shadow: none; }
.mk-chip {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px; border-radius: 6px;
  font: 500 12px/1 var(--mk-mono); color: var(--mk-text-2); background: var(--mk-sunken); box-shadow: inset 0 0 0 1px var(--mk-line);
}
.mk-chip svg { width: 12px; height: 12px; }

/* ---------- buttons ---------- */
.mk-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 32px; padding: 6px 13px;
  font: 550 13px/1.25 var(--mk-font); color: var(--mk-text); cursor: pointer; text-align: center;
  background: var(--mk-raised); border: 1px solid var(--mk-line-2); border-radius: 8px;
  box-shadow: inset 0 1px 0 var(--mk-hi), 0 1px 2px rgba(0, 0, 0, .14);
  transition: background .15s, border-color .15s, color .15s;
}
.mk-btn:hover { border-color: var(--mk-line-3); background: var(--mk-sunken); }
.mk-btn:active { transform: translateY(1px); }
.mk-btn:disabled { cursor: not-allowed; opacity: .55; transform: none; }
.mk-btn kbd { margin-left: 2px; }
.mk-btn.primary { color: var(--mk-on-accent, #fff); background: var(--mk-accent-fill); border-color: transparent; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), 0 2px 6px -2px rgba(0, 0, 0, .45); }
.mk-btn.primary:hover { background: color-mix(in srgb, var(--mk-accent-fill) 88%, #fff); }
.mk-btn.primary kbd { background: rgba(0, 0, 0, .22); color: rgba(255, 255, 255, .9); box-shadow: none; }
.mk-btn.danger { color: var(--mk-bad); border-color: color-mix(in srgb, var(--mk-bad) 35%, transparent); }
/* Primary and danger together: a filled red button with white text (never red on violet). */
.mk-btn.primary.danger:not([data-state]) { color: #fff; background: var(--mk-bad-fill); border-color: transparent; }
.mk-btn.primary.danger:not([data-state]):hover { background: color-mix(in srgb, var(--mk-bad-fill) 88%, #000); }
.mk-btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--mk-text-2); }
.mk-btn.ghost:hover { background: var(--mk-sunken); color: var(--mk-text); }
.mk-btn.sm { min-height: 26px; padding: 3px 9px; font-size: 12px; border-radius: 7px; }
.mk-btn svg { width: 15px; height: 15px; flex: none; }
/* data-send states: armed (confirm), busy, sent, error */
.mk-btn[data-state="armed"] { color: #fff; background: var(--mk-bad); border-color: transparent; }
.mk-btn[data-state="armed"] kbd { background: rgba(0, 0, 0, .22); color: #fff; box-shadow: none; }
[data-theme="dark"] .mk-btn[data-state="armed"], :root:not([data-theme="light"]) .mk-btn[data-state="armed"] { color: #1a0a0a; }
[data-theme="dark"] .mk-btn[data-state="armed"] kbd { color: #1a0a0a; background: rgba(0, 0, 0, .12); }
.mk-btn[data-state="busy"] { opacity: 1; cursor: progress; }
.mk-btn[data-state="sent"] { opacity: 1; color: var(--mk-good); background: var(--mk-good-soft); border-color: transparent; box-shadow: none; }
.mk-btn[data-state="error"] { color: var(--mk-bad); }
.mk-spin { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--mk-line-3); border-top-color: currentColor; animation: mk-rot .8s linear infinite; flex: none; }
@keyframes mk-rot { to { transform: rotate(360deg); } }
.mk-seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 9px; background: var(--mk-sunken); box-shadow: inset 0 0 0 1px var(--mk-line); }
.mk-seg button { min-height: 26px; padding: 0 10px; border: 0; box-shadow: none; border-radius: 7px; background: transparent; color: var(--mk-text-2); font: 550 13px/1 var(--mk-font); cursor: pointer; }
.mk-seg button[aria-pressed="true"], .mk-seg button[aria-checked="true"] { background: var(--mk-raised); color: var(--mk-text); box-shadow: 0 1px 2px rgba(0, 0, 0, .25), inset 0 0 0 1px var(--mk-line-2); }
.mk-input {
  min-height: 32px; padding: 0 10px; border-radius: 8px; min-width: 0;
  font: 13px var(--mk-font); color: var(--mk-text); background: var(--mk-sunken);
  border: 1px solid var(--mk-line-2); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .12);
}
.mk-input::placeholder { color: var(--mk-text-3); }
.mk-search { position: relative; display: inline-flex; align-items: center; }
.mk-search svg { position: absolute; left: 10px; width: 14px; height: 14px; color: var(--mk-text-3); pointer-events: none; }
.mk-search kbd { position: absolute; right: 7px; }
.mk-search .mk-input { width: 100%; padding: 0 30px 0 32px; }

/* ---------- meter ---------- */
.mk-meter { display: grid; gap: 6px; }
.mk-meter .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--mk-text-2); gap: 10px; flex-wrap: wrap; }
.mk-meter .top b { color: var(--mk-text); font-weight: 600; font-variant-numeric: tabular-nums; }
.mk-meter .track { position: relative; height: 8px; border-radius: 99px; background: var(--mk-sunken); box-shadow: inset 0 0 0 1px var(--mk-line); }
.mk-meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--c, var(--mk-accent)); }
/* The pace tick stays readable on top of any fill: text-coloured with a canvas keyline. */
.mk-meter .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--mk-text); box-shadow: 0 0 0 1.5px var(--mk-surface); }

/* ---------- list ---------- */
.mk-list { list-style: none; margin: 0; padding: 0; }
.mk-list > li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--mk-line); min-width: 0; }
.mk-list > li:first-child { border-top: 0; padding-top: 2px; }
.mk-list .grow { flex: 1; min-width: 0; }
.mk-list .t { font-weight: 550; color: var(--mk-text); overflow-wrap: anywhere; }
.mk-list .s { font-size: 12px; color: var(--mk-text-3); overflow-wrap: anywhere; }
.mk-list .v { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--mk-text); white-space: nowrap; }
@container (max-width: 300px) { .mk-list .mk-bar-cell { display: none; } }
.mk-icon { width: 28px; height: 28px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--mk-sunken); color: var(--mk-text-2); box-shadow: inset 0 0 0 1px var(--mk-line); }
.mk-icon svg { width: 15px; height: 15px; }
.mk-icon.good { color: var(--mk-good); background: var(--mk-good-soft); box-shadow: none; }
.mk-icon.bad { color: var(--mk-bad); background: var(--mk-bad-soft); box-shadow: none; }
.mk-icon.warn { color: var(--mk-warn); background: var(--mk-warn-soft); box-shadow: none; }
.mk-icon.info { color: var(--mk-info); background: var(--mk-info-soft); box-shadow: none; }
.mk-avatar { width: 22px; height: 22px; flex: none; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 650; color: #fff; text-transform: uppercase; background: var(--a, var(--mk-accent-fill)); }

/* ---------- steps (a pipeline); vertical when the card is narrow ---------- */
.mk-steps { display: flex; list-style: none; margin: 0; padding: 0; }
.mk-steps li { flex: 1; min-width: 0; position: relative; padding: 22px 4px 0 0; font-size: 12px; color: var(--mk-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mk-steps li::before { content: ""; position: absolute; top: 5px; left: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--mk-surface); box-shadow: inset 0 0 0 2px var(--mk-line-3); z-index: 1; }
.mk-steps li::after { content: ""; position: absolute; top: 10px; left: 15px; right: 3px; height: 2px; border-radius: 2px; background: var(--mk-line-2); }
.mk-steps li:last-child::after { display: none; }
.mk-steps li b { display: block; font-weight: 550; color: var(--mk-text-2); overflow: hidden; text-overflow: ellipsis; }
.mk-steps li[data-state="done"]::before { background: var(--mk-good); box-shadow: none; }
.mk-steps li[data-state="done"]::after { background: color-mix(in srgb, var(--mk-good) 55%, transparent); }
.mk-steps li[data-state="active"]::before { box-shadow: inset 0 0 0 3.5px var(--mk-info); }
.mk-steps li[data-state="active"] b { color: var(--mk-text); }
.mk-steps li[data-state="failed"]::before { background: var(--mk-bad); box-shadow: none; }
.mk-steps li[data-state="failed"] b { color: var(--mk-bad); }
@container (max-width: 220px) {
  .mk-steps { flex-direction: column; gap: 6px; }
  .mk-steps li { padding: 0 0 0 22px; display: flex; gap: 8px; align-items: baseline; }
  .mk-steps li::before { top: 3px; }
  .mk-steps li::after { left: 5px; top: 17px; width: 2px; height: 8px; right: auto; }
}

/* ---------- callout ---------- */
.mk-callout {
  display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--mk-r);
  background: var(--mk-sunken); border: 1px solid var(--mk-line); color: var(--mk-text-2); font-size: 14px;
}
