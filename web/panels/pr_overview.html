<title>Muster PR overview</title>
<style>
/* Muster Kit: the "Briefing" look for every panel.
   Built-ins and agent-written panels share it. web/dev/build_panels.ts puts it into every built-in
   app, and Muster injects it (with kit.js) in front of a custom panel opened with kit: true, so an
   agent's own HTML spends none of its 1 MiB on it.
   Type scale (px): 11 · 12 · 13 · 14 · 15 · 17 · 20 · 26. Nothing below 11.
   Contrast: text tokens ≥ 4.5:1 on every surface they sit on, in both themes; marks ≥ 3:1.
   Scope: everything lives under .mk (kit.js puts it on <html>); data-theme comes from the host. */

/* The two fonts (Inter and JetBrains Mono, OFL; web/panels/fonts/) are @font-face rules with
   data: URIs that Muster puts in place of this marker when it serves the panel (src/panel_kit.rs). */
/*MK-FONTS*/

:root, [data-theme] {
  --mk-font: "MK Inter", Inter, system-ui, sans-serif;
  --mk-mono: "MK Mono", "JetBrains Mono", ui-monospace, monospace;
  --mk-r-sm: 6px;
  --mk-r: 10px;
  --mk-r-lg: 14px;
  --mk-ease: cubic-bezier(.16, 1, .3, 1);
}

/* ---------- dark (default) ---------- */
:root, [data-theme="dark"] {
  color-scheme: dark;
  --mk-canvas: #121215;
  --mk-surface: #18181c;
  --mk-raised: #1e1e23;
  --mk-sunken: #0e0e10;
  --mk-line: rgba(255, 255, 255, .065);
  --mk-line-2: rgba(255, 255, 255, .11);
  --mk-line-3: rgba(255, 255, 255, .2);
  --mk-hi: rgba(255, 255, 255, .035);
  --mk-text: #ececf1;
  --mk-text-2: #b4b4c0;
  --mk-text-3: #93939f;                      /* ≥ 5.4:1 on every dark surface */
  --mk-accent: #a194ff;
  --mk-accent-fill: #6652e0;
  --mk-accent-soft: rgba(161, 148, 255, .13);
  --mk-on-accent: #fff;
  --mk-good: #4fc98c;  --mk-good-soft: rgba(79, 201, 140, .12);
  --mk-warn: #f2b450;  --mk-warn-soft: rgba(242, 180, 80, .12);
  --mk-bad: #ff7b78;   --mk-bad-soft: rgba(255, 123, 120, .12);
  --mk-info: #74b4ff;  --mk-info-soft: rgba(116, 180, 255, .12);
  --mk-add: #4fc98c; --mk-del: #ff7b78;
  --mk-add-bg: rgba(79, 201, 140, .09); --mk-del-bg: rgba(255, 123, 120, .09);
  /* Categorical series: violet leads (Muster's own colour), teal second; no series hue is the good-green or bad-red. */
  --mk-c1: #a194ff; --mk-c2: #41c7c1; --mk-c3: #f2b450; --mk-c4: #5fb4ff;
  --mk-c5: #e98bd6; --mk-c6: #cfab84; --mk-c7: #8f9bff; --mk-c8: #f0866b;
  --mk-context: #6b6b78;                     /* de-emphasised series: 3.6:1 on canvas */
  --mk-shadow: 0 1px 0 var(--mk-hi) inset, 0 10px 28px -14px rgba(0, 0, 0, .7);
  --mk-pop: 0 18px 44px -12px rgba(0, 0, 0, .75), 0 0 0 1px rgba(255, 255, 255, .08);
  --mk-select: rgba(161, 148, 255, .32);
}

/* ---------- light ---------- */
[data-theme="light"] {
  color-scheme: light;
  --mk-canvas: #f7f7f9;
  --mk-surface: #ffffff;
  --mk-raised: #ffffff;
  --mk-sunken: #f0f0f4;
  --mk-line: rgba(20, 20, 40, .075);
  --mk-line-2: rgba(20, 20, 40, .12);
  --mk-line-3: rgba(20, 20, 40, .22);
  --mk-hi: rgba(255, 255, 255, 1);
  --mk-text: #17171c;
  --mk-text-2: #4c4c57;
  --mk-text-3: #64646f;                      /* ≥ 5.1:1 on every light surface */
  --mk-accent: #5a48d8;
  --mk-accent-fill: #5a48d8;
  --mk-accent-soft: rgba(90, 72, 216, .09);
  --mk-good: #146b44;  --mk-good-soft: rgba(20, 107, 68, .08);   /* ≥ 5.6:1 on its soft fill */
  --mk-warn: #8a4f00;  --mk-warn-soft: rgba(214, 138, 0, .11);   /* ≥ 5.4:1 */
  --mk-bad: #b81f28;   --mk-bad-soft: rgba(201, 37, 45, .07);    /* ≥ 5.6:1 */
  --mk-info: #1a5fb8;  --mk-info-soft: rgba(31, 111, 209, .08);  /* ≥ 5.5:1 */
  --mk-add: #1a7f37; --mk-del: #cf222e;
  --mk-add-bg: rgba(26, 127, 55, .08); --mk-del-bg: rgba(207, 34, 46, .07);
  --mk-c1: #6a56e6; --mk-c2: #0e8a85; --mk-c3: #b97500; --mk-c4: #2b7bd9;
  --mk-c5: #bb3f9c; --mk-c6: #8f6b45; --mk-c7: #4d5bd6; --mk-c8: #c8553a;
  --mk-context: #a3a3b0;                     /* 2.5:1: recessive on purpose; series that matter get a colour */
  --mk-shadow: 0 1px 2px rgba(20, 20, 40, .05), 0 8px 24px -14px rgba(20, 20, 40, .18);
  --mk-pop: 0 18px 44px -12px rgba(20, 20, 40, .26), 0 0 0 1px rgba(20, 20, 40, .08);
  --mk-select: rgba(90, 72, 216, .2);
}

/* ---------- base ---------- */
.mk {
  background: var(--mk-canvas);
  color: var(--mk-text);
  font: 14px/1.55 var(--mk-font);
  font-feature-settings: "cv11", "ss03", "calt";
  -webkit-font-smoothing: antialiased;
  caret-color: var(--mk-accent);
  scrollbar-color: var(--mk-line-3) transparent;
  scrollbar-width: thin;
}
.mk ::selection { background: var(--mk-select); color: inherit; }
.mk ::-webkit-scrollbar { width: 10px; height: 10px; }
.mk ::-webkit-scrollbar-thumb { background: var(--mk-line-3); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
.mk ::-webkit-scrollbar-thumb:hover { background-color: var(--mk-text-3); }
.mk ::-webkit-scrollbar-track, .mk ::-webkit-scrollbar-corner { background: transparent; }
.mk *, .mk *::before, .mk *::after { box-sizing: border-box; }
.mk :focus-visible { outline: 2px solid var(--mk-accent); outline-offset: 2px; border-radius: 4px; }
.mk .num, .mk .mk-num { font-variant-numeric: tabular-nums; }
.mk code, .mk kbd, .mk .mono { font-family: var(--mk-mono); font-size: .86em; letter-spacing: 0; }
.mk a { color: var(--mk-accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.mk kbd {
  display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 5px; text-align: center;
  font-size: 11px; line-height: 17px; color: var(--mk-text-3);
  background: var(--mk-sunken); box-shadow: inset 0 -1px 0 var(--mk-line-2), inset 0 0 0 1px var(--mk-line);
}

/* ---------- page and header: the finding first ---------- */
.mk-page { padding: 22px 26px 28px; max-width: 1180px; margin: 0 auto; container-type: inline-size; }
.mk-head { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; margin-bottom: 20px; }
.mk-head > div:first-child { min-width: 0; flex: 1 1 300px; }
.mk-title { margin: 0; font-size: 20px; line-height: 1.25; font-weight: 640; letter-spacing: -0.018em; color: var(--mk-text); text-wrap: pretty; }
/* What the panel is about (repo, period). Trails the title; never sits above it. */
.mk-scope { display: inline-block; font-size: 14px; font-weight: 450; letter-spacing: -0.005em; color: var(--mk-text-3); margin-left: 4px; }
.mk-takeaway { margin: 6px 0 0; font-size: 15px; line-height: 1.5; color: var(--mk-text-2); max-width: 68ch; text-wrap: pretty; }
.mk-takeaway b, .mk-takeaway strong { color: var(--mk-text); font-weight: 600; }
.mk-section { margin-top: 24px; }
.mk-section > h2, .mk-h2 {
  display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px;
  font-size: 13px; font-weight: 620; letter-spacing: -0.003em; color: var(--mk-text-2);
}
.mk-section > h2 .count, .mk-h2 .count { color: var(--mk-text-3); font-weight: 450; }
.mk-foot {
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between;
  margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--mk-line);
  font-size: 12px; color: var(--mk-text-3);
}
.mk-note { margin: 10px 0 0; font-size: 12px; color: var(--mk-text-3); }

/* ---------- layout ---------- */
.mk-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--min, 220px)), 1fr)); }
.mk-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.mk-stack { display: grid; gap: 14px; }
/* A cell that takes the whole row, at any width (no phantom columns when the grid drops to one). */
.mk-wide, .mk-span-2 { grid-column: 1 / -1; }
.mk-cell { min-width: 0; display: grid; }
.mk-cell.mk-actions { align-items: center; }

/* ---------- card ---------- */
.mk-card {
  position: relative; min-width: 0; container-type: inline-size;
  background: var(--mk-surface); border: 1px solid var(--mk-line); border-radius: var(--mk-r);
  box-shadow: var(--mk-shadow); padding: 14px 16px;
}
.mk-card > h2, .mk-card > h3, .mk-card-title {
  display: flex; align-items: baseline; gap: 8px; margin: 0 0 12px;
  font-size: 13px; font-weight: 620; color: var(--mk-text); letter-spacing: -0.003em;
}
.mk-card .aside { margin-left: auto; font-weight: 450; font-size: 12px; color: var(--mk-text-3); }
/* Tone: the card's own border and a faint wash, never a side stripe. */
.mk-card.tone-good { border-color: color-mix(in srgb, var(--mk-good) 40%, transparent); background: color-mix(in srgb, var(--mk-good) 4%, var(--mk-surface)); }
.mk-card.tone-warn { border-color: color-mix(in srgb, var(--mk-warn) 40%, transparent); background: color-mix(in srgb, var(--mk-warn) 4%, var(--mk-surface)); }
.mk-card.tone-bad  { border-color: color-mix(in srgb, var(--mk-bad) 40%, transparent);  background: color-mix(in srgb, var(--mk-bad) 4%, var(--mk-surface)); }
.mk-card.flat { box-shadow: none; background: transparent; }

/* ---------- stat ---------- */
.mk-stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mk-stat .label { font-size: 12px; color: var(--mk-text-2); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.mk-stat .label i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }
.mk-stat .value {
  font-size: 26px; line-height: 1.15; font-weight: 620; letter-spacing: -0.025em; color: var(--mk-text);
  font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
}
.mk-stat .value small { font-size: 13px; font-weight: 500; color: var(--mk-text-3); margin-left: 3px; letter-spacing: 0; }
.mk-stat .meta { display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; font-size: 12px; color: var(--mk-text-3); }
.mk-stat svg.spark { margin-top: auto; padding-top: 6px; max-width: 100%; }
.mk-delta { display: inline-flex; align-items: center; padding: 1px 6px; border-radius: 999px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mk-delta.up { color: var(--mk-good); background: var(--mk-good-soft); }
.mk-delta.down { color: var(--mk-bad); background: var(--mk-bad-soft); }
.mk-delta.flat { color: var(--mk-text-2); background: var(--mk-sunken); }
.mk-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); border: 1px solid var(--mk-line); border-radius: var(--mk-r); background: var(--mk-surface); box-shadow: var(--mk-shadow); overflow: hidden; }
.mk-stats > .mk-stat { padding: 13px 16px 14px; border-right: 1px solid var(--mk-line); border-bottom: 1px solid var(--mk-line); margin: 0 -1px -1px 0; }

/* ---------- badge / chip ---------- */
.mk-badge {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px;
  font-size: 12px; font-weight: 600; white-space: nowrap;
  color: var(--mk-text-2); background: var(--mk-sunken); box-shadow: inset 0 0 0 1px var(--mk-line);
}
.mk-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.mk-badge.plain::before { display: none; }
.mk-badge.good { color: var(--mk-good); background: var(--mk-good-soft); box-shadow: none; }
.mk-badge.warn { color: var(--mk-warn); background: var(--mk-warn-soft); box-shadow: none; }
.mk-badge.bad  { color: var(--mk-bad);  background: var(--mk-bad-soft);  box-shadow: none; }
.mk-badge.info { color: var(--mk-info); background: var(--mk-info-soft); box-shadow: none; }
.mk-badge.accent { color: var(--mk-accent); background: var(--mk-accent-soft); box-shadow: none; }
.mk-chip {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px; border-radius: 6px;
  font: 500 12px/1 var(--mk-mono); color: var(--mk-text-2); background: var(--mk-sunken); box-shadow: inset 0 0 0 1px var(--mk-line);
}
.mk-chip svg { width: 12px; height: 12px; }

/* ---------- buttons ---------- */
.mk-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 32px; padding: 6px 13px;
  font: 550 13px/1.25 var(--mk-font); color: var(--mk-text); cursor: pointer; text-align: center;
  background: var(--mk-raised); border: 1px solid var(--mk-line-2); border-radius: 8px;
  box-shadow: inset 0 1px 0 var(--mk-hi), 0 1px 2px rgba(0, 0, 0, .14);
  transition: background .15s, border-color .15s, color .15s;
}
.mk-btn:hover { border-color: var(--mk-line-3); background: var(--mk-sunken); }
.mk-btn:active { transform: translateY(1px); }
.mk-btn:disabled { cursor: not-allowed; opacity: .55; transform: none; }
.mk-btn kbd { margin-left: 2px; }
.mk-btn.primary { color: var(--mk-on-accent, #fff); background: var(--mk-accent-fill); border-color: transparent; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), 0 2px 6px -2px rgba(0, 0, 0, .45); }
.mk-btn.primary:hover { background: color-mix(in srgb, var(--mk-accent-fill) 88%, #fff); }
.mk-btn.primary kbd { background: rgba(0, 0, 0, .22); color: rgba(255, 255, 255, .9); box-shadow: none; }
.mk-btn.danger { color: var(--mk-bad); border-color: color-mix(in srgb, var(--mk-bad) 35%, transparent); }
.mk-btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--mk-text-2); }
.mk-btn.ghost:hover { background: var(--mk-sunken); color: var(--mk-text); }
.mk-btn.sm { min-height: 26px; padding: 3px 9px; font-size: 12px; border-radius: 7px; }
.mk-btn svg { width: 15px; height: 15px; flex: none; }
/* data-send states: armed (confirm), busy, sent, error */
.mk-btn[data-state="armed"] { color: #fff; background: var(--mk-bad); border-color: transparent; }
.mk-btn[data-state="armed"] kbd { background: rgba(0, 0, 0, .22); color: #fff; box-shadow: none; }
[data-theme="dark"] .mk-btn[data-state="armed"], :root:not([data-theme="light"]) .mk-btn[data-state="armed"] { color: #1a0a0a; }
[data-theme="dark"] .mk-btn[data-state="armed"] kbd { color: #1a0a0a; background: rgba(0, 0, 0, .12); }
.mk-btn[data-state="busy"] { opacity: 1; cursor: progress; }
.mk-btn[data-state="sent"] { opacity: 1; color: var(--mk-good); background: var(--mk-good-soft); border-color: transparent; box-shadow: none; }
.mk-btn[data-state="error"] { color: var(--mk-bad); }
.mk-spin { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--mk-line-3); border-top-color: currentColor; animation: mk-rot .8s linear infinite; flex: none; }
@keyframes mk-rot { to { transform: rotate(360deg); } }
.mk-seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 9px; background: var(--mk-sunken); box-shadow: inset 0 0 0 1px var(--mk-line); }
.mk-seg button { min-height: 26px; padding: 0 10px; border: 0; box-shadow: none; border-radius: 7px; background: transparent; color: var(--mk-text-2); font: 550 13px/1 var(--mk-font); cursor: pointer; }
.mk-seg button[aria-pressed="true"], .mk-seg button[aria-checked="true"] { background: var(--mk-raised); color: var(--mk-text); box-shadow: 0 1px 2px rgba(0, 0, 0, .25), inset 0 0 0 1px var(--mk-line-2); }
.mk-input {
  min-height: 32px; padding: 0 10px; border-radius: 8px; min-width: 0;
  font: 13px var(--mk-font); color: var(--mk-text); background: var(--mk-sunken);
  border: 1px solid var(--mk-line-2); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .12);
}
.mk-input::placeholder { color: var(--mk-text-3); }
.mk-search { position: relative; display: inline-flex; align-items: center; }
.mk-search svg { position: absolute; left: 10px; width: 14px; height: 14px; color: var(--mk-text-3); pointer-events: none; }
.mk-search kbd { position: absolute; right: 7px; }
.mk-search .mk-input { width: 100%; padding: 0 30px 0 32px; }

/* ---------- meter ---------- */
.mk-meter { display: grid; gap: 6px; }
.mk-meter .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--mk-text-2); gap: 10px; flex-wrap: wrap; }
.mk-meter .top b { color: var(--mk-text); font-weight: 600; font-variant-numeric: tabular-nums; }
.mk-meter .track { position: relative; height: 8px; border-radius: 99px; background: var(--mk-sunken); box-shadow: inset 0 0 0 1px var(--mk-line); }
.mk-meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--c, var(--mk-accent)); }
/* The pace tick stays readable on top of any fill: text-coloured with a canvas keyline. */
.mk-meter .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--mk-text); box-shadow: 0 0 0 1.5px var(--mk-surface); }

/* ---------- list ---------- */
.mk-list { list-style: none; margin: 0; padding: 0; }
.mk-list > li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--mk-line); min-width: 0; }
.mk-list > li:first-child { border-top: 0; padding-top: 2px; }
.mk-list .grow { flex: 1; min-width: 0; }
.mk-list .t { font-weight: 550; color: var(--mk-text); overflow-wrap: anywhere; }
.mk-list .s { font-size: 12px; color: var(--mk-text-3); overflow-wrap: anywhere; }
.mk-list .v { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--mk-text); white-space: nowrap; }
@container (max-width: 300px) { .mk-list .mk-bar-cell { display: none; } }
.mk-icon { width: 28px; height: 28px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--mk-sunken); color: var(--mk-text-2); box-shadow: inset 0 0 0 1px var(--mk-line); }
.mk-icon svg { width: 15px; height: 15px; }
.mk-icon.good { color: var(--mk-good); background: var(--mk-good-soft); box-shadow: none; }
.mk-icon.bad { color: var(--mk-bad); background: var(--mk-bad-soft); box-shadow: none; }
.mk-icon.warn { color: var(--mk-warn); background: var(--mk-warn-soft); box-shadow: none; }
.mk-icon.info { color: var(--mk-info); background: var(--mk-info-soft); box-shadow: none; }
.mk-avatar { width: 22px; height: 22px; flex: none; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 650; color: #fff; text-transform: uppercase; background: var(--a, var(--mk-accent-fill)); }

/* ---------- steps (a pipeline); vertical when the card is narrow ---------- */
.mk-steps { display: flex; list-style: none; margin: 0; padding: 0; }
.mk-steps li { flex: 1; min-width: 0; position: relative; padding: 22px 4px 0 0; font-size: 12px; color: var(--mk-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mk-steps li::before { content: ""; position: absolute; top: 5px; left: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--mk-surface); box-shadow: inset 0 0 0 2px var(--mk-line-3); z-index: 1; }
.mk-steps li::after { content: ""; position: absolute; top: 10px; left: 15px; right: 3px; height: 2px; border-radius: 2px; background: var(--mk-line-2); }
.mk-steps li:last-child::after { display: none; }
.mk-steps li b { display: block; font-weight: 550; color: var(--mk-text-2); overflow: hidden; text-overflow: ellipsis; }
.mk-steps li[data-state="done"]::before { background: var(--mk-good); box-shadow: none; }
.mk-steps li[data-state="done"]::after { background: color-mix(in srgb, var(--mk-good) 55%, transparent); }
.mk-steps li[data-state="active"]::before { box-shadow: inset 0 0 0 3.5px var(--mk-info); }
.mk-steps li[data-state="active"] b { color: var(--mk-text); }
.mk-steps li[data-state="failed"]::before { background: var(--mk-bad); box-shadow: none; }
.mk-steps li[data-state="failed"] b { color: var(--mk-bad); }
@container (max-width: 220px) {
  .mk-steps { flex-direction: column; gap: 6px; }
  .mk-steps li { padding: 0 0 0 22px; display: flex; gap: 8px; align-items: baseline; }
  .mk-steps li::before { top: 3px; }
  .mk-steps li::after { left: 5px; top: 17px; width: 2px; height: 8px; right: auto; }
}

/* ---------- callout ---------- */
.mk-callout {
  display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--mk-r);
  background: var(--mk-sunken); border: 1px solid var(--mk-line); color: var(--mk-text-2); font-size: 14px;
}
.mk-callout > svg { flex: none; width: 18px; height: 18px; margin-top: 1px; color: var(--mk-text-3); }
.mk-callout b, .mk-callout strong { color: var(--mk-text); font-weight: 600; }
.mk-callout.good { background: var(--mk-good-soft); border-color: color-mix(in srgb, var(--mk-good) 28%, transparent); } .mk-callout.good > svg { color: var(--mk-good); }
.mk-callout.warn { background: var(--mk-warn-soft); border-color: color-mix(in srgb, var(--mk-warn) 28%, transparent); } .mk-callout.warn > svg { color: var(--mk-warn); }
.mk-callout.bad  { background: var(--mk-bad-soft);  border-color: color-mix(in srgb, var(--mk-bad) 28%, transparent); }  .mk-callout.bad > svg { color: var(--mk-bad); }
.mk-callout.info { background: var(--mk-info-soft); border-color: color-mix(in srgb, var(--mk-info) 28%, transparent); } .mk-callout.info > svg { color: var(--mk-info); }

/* ---------- empty / error ---------- */
.mk-empty { display: grid; place-content: center; justify-items: center; gap: 4px; text-align: center; padding: 24px; border-radius: var(--mk-r); border: 1px dashed var(--mk-line-3); color: var(--mk-text-3); font-size: 13px; }
.mk-empty svg { width: 22px; height: 22px; margin-bottom: 4px; }
.mk-empty b { color: var(--mk-text); font-weight: 600; font-size: 14px; }
.mk-error { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--mk-r); background: var(--mk-bad-soft); border: 1px solid color-mix(in srgb, var(--mk-bad) 30%, transparent); color: var(--mk-text-2); font-size: 13px; }
.mk-error svg { width: 16px; height: 16px; color: var(--mk-bad); flex: none; margin-top: 2px; }
.mk-error b { color: var(--mk-text); font-weight: 600; }

/* ---------- key/value, log, timeline, ring row ---------- */
.mk-kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; font-size: 13px; }
.mk-kv dt { color: var(--mk-text-3); }
.mk-kv dd { margin: 0; color: var(--mk-text); min-width: 0; overflow-wrap: anywhere; }
.mk-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; min-width: 0; }
.mk-card-head .name { font-weight: 640; font-size: 15px; letter-spacing: -0.01em; color: var(--mk-text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mk-card-head > .mk-badge, .mk-card-head > .aside { margin-left: auto; }
.mk-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--mk-text-3); }
.mk-split { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px 14px; padding-top: 12px; margin-top: 14px; border-top: 1px solid var(--mk-line); }
.mk-split .mk-stat .value { font-size: 20px; }
.mk-card .mk-steps { margin-top: 14px; }
.mk-timeline { list-style: none; margin: 0; padding: 0; }
.mk-timeline li { position: relative; padding: 0 0 12px 22px; font-size: 13px; color: var(--mk-text-2); }
.mk-timeline li::before { content: ""; position: absolute; left: 4px; top: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--mk-line-3)); }
.mk-timeline li::after { content: ""; position: absolute; left: 7px; top: 18px; bottom: 0; width: 1px; background: var(--mk-line-2); }
.mk-timeline li:last-child { padding-bottom: 0; }
.mk-timeline li:last-child::after { display: none; }
.mk-timeline li.good { --c: var(--mk-good); } .mk-timeline li.bad { --c: var(--mk-bad); } .mk-timeline li.info { --c: var(--mk-info); } .mk-timeline li.warn { --c: var(--mk-warn); }
.mk-timeline b { color: var(--mk-text); font-weight: 550; }
.mk-timeline time { display: block; font-size: 12px; color: var(--mk-text-3); font-variant-numeric: tabular-nums; }
.mk-pre { margin: 8px 0 0; padding: 9px 11px; border-radius: 8px; background: var(--mk-sunken); border: 1px solid var(--mk-line); font: 12px/1.55 var(--mk-mono); color: var(--mk-text-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.mk-pre mark { background: none; color: var(--mk-bad); }
.mk-pre ins { text-decoration: none; color: var(--mk-good); }
.mk-ringrow { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.mk-keys { display: grid; gap: 8px; font-size: 13px; flex: 1; min-width: 150px; }
.mk-keys div { display: flex; align-items: center; gap: 8px; color: var(--mk-text-2); }
.mk-keys i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); flex: none; }
.mk-keys b { margin-left: auto; color: var(--mk-text); font-variant-numeric: tabular-nums; font-weight: 600; }
.mk-keys .hit { color: var(--mk-text); font-weight: 600; }

/* ---------- table ---------- */
.mk-table-wrap { border: 1px solid var(--mk-line); border-radius: var(--mk-r); background: var(--mk-surface); box-shadow: var(--mk-shadow); overflow: auto; }
.mk-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.mk-table th {
  position: sticky; top: 0; z-index: 1; text-align: left; white-space: nowrap; user-select: none;
  padding: 0 14px; height: 38px; font-size: 12px; font-weight: 600; color: var(--mk-text-3);
  background: var(--mk-surface); border-bottom: 1px solid var(--mk-line-2);
}
.mk-table.sortable th { cursor: pointer; }
.mk-table.sortable th:hover { color: var(--mk-text-2); }
.mk-table th .arr { display: inline-block; margin-left: 4px; color: var(--mk-accent); }
.mk-table th[aria-sort] { color: var(--mk-text); }
.mk-table td { padding: 0 14px; height: 40px; border-bottom: 1px solid var(--mk-line); color: var(--mk-text); white-space: nowrap; }
.mk-table tr:last-child td { border-bottom: 0; }
.mk-table tbody tr:hover, .mk-table tbody tr.hover { background: var(--mk-accent-soft); }
.mk-table .r { text-align: right; }
.mk-table td.n { font-family: var(--mk-mono); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.mk-table td.dim { color: var(--mk-text-3); }
.mk-table td.file { font-family: var(--mk-mono); font-size: 12px; color: var(--mk-text-2); }
.mk-bar-cell { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
.mk-bar-cell .b { flex: 0 0 72px; height: 6px; border-radius: 3px; background: var(--mk-sunken); box-shadow: inset 0 0 0 1px var(--mk-line); overflow: hidden; }
.mk-bar-cell .b i { display: block; height: 100%; border-radius: 3px; background: var(--c, var(--mk-accent)); }

/* ---------- chart ---------- */
.mk-chart { position: relative; min-width: 0; display: block; }
.mk-chart figure { margin: 0; position: relative; }
.mk-chart svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.mk-chart svg:focus-visible { outline-offset: 6px; }
.mk-chart .grid line { stroke: var(--mk-line); }
.mk-chart .base { stroke: var(--mk-line-3); }
.mk-chart .tick { fill: var(--mk-text-3); font: 400 11px var(--mk-mono); }
.mk-chart .tick.x { font-family: var(--mk-font); font-size: 12px; }
.mk-chart .ylab { fill: var(--mk-text-3); font: 550 12px var(--mk-font); }
.mk-chart .vlab { fill: var(--mk-text-2); font: 600 11px var(--mk-font); font-variant-numeric: tabular-nums; }
.mk-chart .vlab.nil { fill: var(--mk-text-3); font-weight: 400; }
.mk-chart .end { font: 600 12px var(--mk-font); font-variant-numeric: tabular-nums; }
.mk-chart .end tspan.n { fill: var(--mk-text-3); font-weight: 500; }
.mk-chart .band { fill: var(--mk-text); opacity: .05; }
.mk-chart .guide { stroke: var(--mk-text-3); stroke-dasharray: 2 3; }
.mk-chart .ann line { stroke: var(--mk-text-3); stroke-dasharray: 3 3; }
.mk-chart .ann rect { fill: var(--mk-raised); stroke: var(--mk-line-2); }
.mk-chart .ann text { fill: var(--mk-text-2); font: 600 11px var(--mk-font); }
.mk-chart .ann text.callout { fill: var(--mk-text); font-size: 12px; }
.mk-legend { display: flex; flex-wrap: wrap; gap: 2px; margin: 0 0 10px -8px; padding: 0; list-style: none; }
.mk-legend button {
  display: inline-flex; align-items: center; gap: 7px; min-height: 28px; padding: 0 10px 0 8px; border-radius: 7px;
  border: 0; background: transparent; box-shadow: none; color: var(--mk-text-2); font: 550 13px/1 var(--mk-font); cursor: pointer;
}
.mk-legend button:hover { background: var(--mk-sunken); color: var(--mk-text); }
.mk-legend button[aria-pressed="false"] { color: var(--mk-text-3); text-decoration: line-through; text-decoration-color: var(--mk-line-3); }
.mk-legend button[aria-pressed="false"] .sw { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
.mk-legend .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.mk-legend .sw.line { height: 3px; width: 14px; border-radius: 2px; }
.mk-legend .v { color: var(--mk-text-3); font-weight: 500; font-variant-numeric: tabular-nums; }
/* The one frosted surface in a panel: it floats over the data it describes. */
.mk-tip {
  position: absolute; z-index: 5; pointer-events: none; min-width: 172px; padding: 9px 11px 10px; border-radius: 10px;
  background: color-mix(in srgb, var(--mk-raised) 90%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: var(--mk-pop); font-size: 12px;
}
.mk-tip .x { display: flex; justify-content: space-between; gap: 12px; font-weight: 650; color: var(--mk-text); margin-bottom: 6px; font-size: 12px; }
.mk-tip .x span { font-weight: 450; color: var(--mk-text-3); }
.mk-tip .row { display: flex; align-items: center; gap: 8px; color: var(--mk-text-2); line-height: 1.75; }
.mk-tip .row i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); flex: none; }
.mk-tip .row b { margin-left: auto; padding-left: 14px; font: 600 12px var(--mk-mono); color: var(--mk-text); }
.mk-tip .row em { font-style: normal; font-size: 11px; color: var(--mk-text-3); font-family: var(--mk-mono); min-width: 46px; text-align: right; }
.mk-heads { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 4px 0 16px; }
.mk-heads .mk-stat .value { font-size: 22px; }

/* ---------- skeleton ---------- */
.mk-skel { border-radius: 6px; background: linear-gradient(90deg, var(--mk-line-2) 0%, var(--mk-line-3) 40%, var(--mk-line-2) 80%) 0 0/300% 100%; animation: mk-shimmer 1.6s linear infinite; }
@keyframes mk-shimmer { to { background-position: -150% 0; } }
@media (prefers-reduced-motion: reduce) { .mk-skel, .mk-spin { animation: none; } }

/* ---------- additions for the built-ins and the TypeScript renderer ---------- */
.mk-sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.mk-chart .dot { fill-opacity: .85; stroke: var(--mk-canvas); stroke-width: 1.5; }
.mk-chart .trend { stroke-width: 1.5; stroke-dasharray: 5 4; opacity: .8; }
.mk-chart .vlab.ctx { fill: var(--mk-text-3); }
.mk-chart .ring-center, .ring-center { font: 650 28px var(--mk-font); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.ring-sub { fill: var(--mk-text-2); font: 500 12px var(--mk-font); }
.mk-data { overflow-x: auto; margin-top: 12px; }
.mk-data table { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
.mk-data caption { text-align: left; color: var(--mk-text-3); padding-bottom: 6px; font-size: 12px; }
.mk-data th, .mk-data td { padding: 4px 12px 4px 0; border-bottom: 1px solid var(--mk-line); text-align: right; font-family: var(--mk-mono); color: var(--mk-text); white-space: nowrap; }
.mk-data thead th { font-family: var(--mk-font); font-weight: 600; color: var(--mk-text-3); border-bottom-color: var(--mk-line-2); }
.mk-data th[scope="row"], .mk-data thead th:first-child { text-align: left; font-family: var(--mk-font); font-weight: 500; }
.mk-warnings { margin: -8px 0 14px; font-size: 12px; color: var(--mk-warn); }
.mk-board .stats-card .mk-stats { box-shadow: none; }

mk-icon { display: inline-flex; vertical-align: -2px; }
mk-icon svg { width: 15px; height: 15px; }
mk-chart, mk-stat, mk-meter { display: block; }
mk-spark, mk-ring { display: inline-block; line-height: 0; }
.mk-board .mk-cell > .mk-card, .mk-board .mk-cell > .mk-stats { height: 100%; }

/* Shared base of Muster's built-in panel apps, drawn on the kit's tokens (kit/kit.css comes first
   in every built-in). The MCP Apps variable names stay as aliases of the kit tokens, so a host's
   `styles.variables` still apply, and older rules written against them keep working. */
:root, [data-theme] {
  --color-background-primary: var(--mk-canvas);
  --color-background-secondary: var(--mk-surface);
  --color-background-tertiary: var(--mk-sunken);
  --color-text-primary: var(--mk-text);
  --color-text-secondary: var(--mk-text-2);
  --color-text-tertiary: var(--mk-text-3);
  --color-border-primary: var(--mk-line-2);
  --color-border-secondary: var(--mk-line);
  --color-ring-primary: var(--mk-accent);
  --color-text-info: var(--mk-accent);
  --color-background-info: var(--mk-accent-soft);
  --color-text-success: var(--mk-good);
  --color-background-success: var(--mk-good-soft);
  --color-text-danger: var(--mk-bad);
  --color-background-danger: var(--mk-bad-soft);
  --color-text-warning: var(--mk-warn);
  --color-background-warning: var(--mk-warn-soft);
  --accent: var(--mk-accent);
  /* Filled buttons keep white text at 4.5:1 or more in both themes. */
  --accent-fill: var(--mk-accent-fill);
  --on-accent: var(--mk-on-accent);
  --danger-fill: #c4291c;
  --font-sans: var(--mk-font);
  --font-mono: var(--mk-mono);
  --border-radius-sm: var(--mk-r-sm);
  --border-radius-md: 8px;
}
* { box-sizing: border-box; }
html { background: var(--mk-canvas); color: var(--mk-text); }
body { margin: 0; font: 14px/1.55 var(--mk-font); overflow-wrap: anywhere; }
main { padding: 22px 26px 24px; max-width: 1180px; margin: 0 auto; }
@media (max-width: 520px) { main { padding: 16px 16px 18px; } }
h1, h2, h3 { line-height: 1.25; margin: 0; }
h1 { font-size: 20px; font-weight: 640; letter-spacing: -0.018em; }
h2 { font-size: 14px; font-weight: 620; color: var(--mk-text); margin: 0 0 10px; letter-spacing: -0.003em; }
p { margin: 0 0 8px; }
a { color: var(--mk-accent); }
code, kbd, pre, .mono { font-family: var(--mk-mono); }
code, pre, .mono { font-size: 12px; }
:where(button, select, input, textarea) { font: inherit; color: inherit; }
:where(button) {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 32px; padding: 6px 13px;
  font: 550 13px/1.25 var(--mk-font); color: var(--mk-text); cursor: pointer; text-align: center;
  background: var(--mk-raised); border: 1px solid var(--mk-line-2); border-radius: 8px;
  box-shadow: inset 0 1px 0 var(--mk-hi), 0 1px 2px rgba(0, 0, 0, .14);
  transition: background .15s, border-color .15s, color .15s;
}
:where(button):hover:not(:disabled) { border-color: var(--mk-line-3); background: var(--mk-sunken); }
:where(button):disabled { cursor: not-allowed; opacity: .55; }
:where(button) svg { width: 15px; height: 15px; flex: none; }
button.primary { color: var(--mk-on-accent); background: var(--mk-accent-fill); border-color: transparent; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), 0 2px 6px -2px rgba(0, 0, 0, .45); }
button.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--mk-accent-fill) 88%, #fff); border-color: transparent; }
button.primary kbd, button.danger kbd { background: rgba(0, 0, 0, .22); color: rgba(255, 255, 255, .92); box-shadow: none; }
button.danger { color: #fff; background: var(--danger-fill); border-color: transparent; }
button.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--danger-fill) 88%, #fff); }
button.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--mk-text-2); }
button.ghost:hover:not(:disabled) { background: var(--mk-sunken); color: var(--mk-text); }
button.sm { min-height: 26px; padding: 3px 9px; font-size: 12px; border-radius: 7px; }
button.link { display: inline; border: 0; background: none; box-shadow: none; padding: 0; min-height: 0; font: inherit; color: var(--mk-accent); text-decoration: underline; text-underline-offset: 3px; }
button.link:hover:not(:disabled) { background: none; }
:where(button) kbd { margin-left: 2px; }
select, input[type="search"], input[type="text"], textarea {
  min-height: 32px; padding: 5px 10px; border-radius: 8px; min-width: 0;
  font: 13px var(--mk-font); color: var(--mk-text); background: var(--mk-sunken);
  border: 1px solid var(--mk-line-2); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .12);
}
input::placeholder, textarea::placeholder { color: var(--mk-text-3); }
textarea { display: block; width: 100%; resize: vertical; line-height: 1.5; }
:focus-visible { outline: 2px solid var(--mk-accent); outline-offset: 2px; }
.muted { color: var(--mk-text-3); }
.error {
  display: block; border: 1px solid color-mix(in srgb, var(--mk-bad) 30%, transparent); background: var(--mk-bad-soft); color: var(--mk-text-2);
  border-radius: var(--mk-r); padding: 14px 16px; margin: 16px; font-size: 13px;
}
.error strong { color: var(--mk-text); font-weight: 600; font-size: 14px; }
.error ul { margin: 8px 0 0; padding-left: 18px; font-family: var(--mk-mono); font-size: 12px; color: var(--mk-text); }
.warnings { color: var(--mk-warn); font-size: 12px; margin: 0 0 10px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
/* The panel's opening lines: the title with what it covers after it, then the finding. */
.app-head { margin-bottom: 16px; }
.app-head .mk-takeaway { margin-top: 6px; }
.app-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--mk-line); font-size: 12px; color: var(--mk-text-3); }
.app-foot .keys { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; }
@media (max-width: 520px) { .app-head .mk-title { font-size: 17px; } .app-head .mk-takeaway { font-size: 13px; } }

main { padding-bottom: 0; }
.head h1 { font-size: 18px; }
.repo { margin: 2px 0 10px; font-size: 13px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.tools select { flex: 0 1 auto; }
.tools input[type="search"] { flex: 1 1 140px; min-width: 0; }
.empty { padding: 16px 0; }
.group { margin: 14px 0 6px; }
.group:first-child { margin-top: 0; }
.list { outline: none; }
.card {
  position: relative; border: 1px solid var(--color-border-secondary); border-left: 4px solid var(--color-border-primary);
  border-radius: var(--border-radius-md); padding: 8px 10px 8px 10px; margin: 0 0 8px; cursor: pointer;
  background: var(--color-background-primary);
}
.card:hover { background: var(--color-background-secondary); }
.card.selected { border-color: var(--color-ring-primary); box-shadow: 0 0 0 1px var(--color-ring-primary); background: var(--color-background-secondary); }
.card:focus-visible { outline: 2px solid var(--color-ring-primary); outline-offset: 2px; }
.card.risk-high { border-left-color: var(--color-text-danger); }
.card.risk-medium { border-left-color: var(--color-text-warning); }
.card.risk-low { border-left-color: var(--color-text-success); }
.card.selected.risk-high { border-left-color: var(--color-text-danger); }
.card.selected.risk-medium { border-left-color: var(--color-text-warning); }
.card.selected.risk-low { border-left-color: var(--color-text-success); }
/* Held and decided cards step back by their surface, never by fading text: badges keep full
   contrast (4.5:1 or more) in both themes. */
.card.g-merged, .card.g-queued, .card.g-changes_requested, .card.g-held {
  background: var(--color-background-secondary); border-style: dashed; border-left-style: solid;
}
.card.g-merged .title { text-decoration: line-through; text-decoration-color: var(--color-text-tertiary); }
.top { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.num { font-family: var(--font-mono); font-size: 12.5px; color: var(--color-text-secondary); flex: none; }
.title { font-weight: 600; flex: 1 1 160px; min-width: 0; }
.top .badge.status, .top .badge.now { flex: none; }
.meta { font-size: 12.5px; margin: 2px 0 4px; }
.size { font-family: var(--font-mono); font-size: 12px; white-space: nowrap; }
.plus { color: var(--color-text-success); }
.minus { color: var(--color-text-danger); }
.draft { color: var(--color-text-warning); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips:empty { display: none; }
.badge { display: inline-block; border-radius: 999px; padding: 0 8px; font-size: 12px; font-weight: 600; line-height: 1.6; border: 1px solid transparent; white-space: nowrap; }
.badge.success { color: var(--color-text-success); background: var(--color-background-success); }
.badge.warning { color: var(--color-text-warning); background: var(--color-background-warning); }
.badge.danger { color: var(--color-text-danger); background: var(--color-background-danger); }
.badge.info { color: var(--color-text-info); background: var(--color-background-info); }
.badge.muted { color: var(--color-text-secondary); background: var(--color-background-tertiary); }
.label { font-size: 12px; line-height: 1.6; padding: 0 7px; border-radius: 999px; border: 1px solid var(--color-border-primary); color: var(--color-text-secondary); }
.summary { margin: 6px 0 0; font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
