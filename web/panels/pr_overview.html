        const t = a && pr && next2.repo === view?.repo ? outwardTarget(a, target(pr, next2.repo)) : null;
        if (gate.inputTarget(t)) {
          outward = null;
          notice = {
            text: "The PR or the action changed while you were confirming. Check it, then try again.",
            tone: "warning"
          };
        } else if (a && pr) outward = {
          action: a,
          pr
        };
      } else if (merging) {
        const pr = next2.prs.find((x) => x.number === merging.number);
        if (gate.inputTarget(pr && next2.repo === view?.repo ? quickTarget(next2.repo, pr) : null)) {
          merging = null;
          notice = {
            text: "The PR changed while you were confirming. Check it, then Merge again.",
            tone: "warning"
          };
        } else if (pr) merging = pr;
      } else if (sent.size) notice = null;
      sent.clear();
      view = next2;
      warnings = r.warnings;
      render();
      if (moved && selected !== null) reveal(document.getElementById(`pr-${selected}`), document.querySelector(".actions"));
    }
  });
})();
</script></body></html>
