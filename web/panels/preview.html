<!doctype html>
<!-- The panel server's /preview page (src/web_preview.rs): the web_preview panel's frame. It runs no
     script; its CSP holds the inner frame to the dev server's origin. -->
<html><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>Web preview</title>
<style>html,body,iframe{margin:0;border:0;width:100%;height:100%;display:block;overflow:hidden}html{background:#fff}</style></head>
<body><iframe src="__MUSTER_PREVIEW_URL__" title="Web preview" referrerpolicy="no-referrer" allow="clipboard-write; fullscreen"
sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe></body></html>
